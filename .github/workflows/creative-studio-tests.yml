name: Creative Studio tests
on:
  push:
    branches: [feat/creative-studio-two-features, main]
    paths:
      - 'studio/creative-*.js'
      - 'studio/creative-*.css'
      - 'studio/menu-gallery.js'
      - 'studio/vendor/**'
      - 'tests/creative-core.test.js'
      - '.github/workflows/creative-studio-tests.yml'
  pull_request:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/creative-core.test.js tests/menu-gallery.test.js
