name: Menu artwork tests
on:
  push:
    branches: ['feat/menu-artifact-library-24']
    paths: ['studio/menu-gallery.js', 'studio/menu-gallery.css', 'tests/menu-gallery.test.js', '.github/workflows/menu-gallery-tests.yml']
  pull_request:
    branches: [main]
    paths: ['studio/menu-gallery.js', 'studio/menu-gallery.css', 'tests/menu-gallery.test.js', '.github/workflows/menu-gallery-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run menu design and safety tests
        run: node --test tests/menu-gallery.test.js
